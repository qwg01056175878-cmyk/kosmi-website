<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOSMI | Preview</title><style>:root{--gold:#c9a96d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#111;color:#eee9e0;font-family:Arial,'Noto Sans KR',sans-serif}header{padding:20px 7%;border-bottom:1px solid #493b2b;display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}.logo{font:30px Georgia;color:var(--gold);letter-spacing:6px}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:inherit;text-decoration:none}nav a{font-size:12px}button{background:none;border:1px solid #66563f;color:#ddd;padding:8px;cursor:pointer}button.active{color:var(--gold);border-color:var(--gold)}.hero{min-height:72vh;background:radial-gradient(ellipse at 85% 40%,#645038,#201b17 40%,#111 80%);padding:100px 9%;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:12px}h1{font:normal clamp(35px,6vw,76px)/1.18 Georgia,serif;max-width:900px;margin:24px 0}p{line-height:1.85;color:#c7c0b7;max-width:780px}.btn{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:16px 25px;margin-top:22px;align-self:flex-start}section{padding:90px 9%}h2{font:normal clamp(29px,4vw,49px) Georgia,serif}.light{background:#eeeae3;color:#191919}.light p{color:#57524d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}.tile{padding:30px;border:1px solid #554635;background:linear-gradient(140deg,#2d261e,#171717)}.tile h3{font-weight:500}.light .tile{background:#faf8f3;border-color:#d5cabb}.num{color:var(--gold);font:24px Georgia}.brand{text-align:center;background:radial-gradient(ellipse,#4b3825,#111 70%)}.brand h2{font-size:clamp(48px,9vw,100px);letter-spacing:8px;color:var(--gold)}.brand p{margin:auto}.note{font-size:12px;color:#a99b88}footer{padding:28px 9%;border-top:1px solid #3b3229;color:#938778;font-size:12px} smetics<br>OEM / ODM Manufacturer',intro:'KOSMI (주)코스미화장품 is based in Incheon, South Korea, with its own production facilities and equipment. We provide color cosmetics OEM/ODM, client-supplied materials processing, filling and packaging.',cta:'EXPLORE SERVICES →',aboutTitle:'A Real Manufacturing Partner in Korea',aboutText:'Established in 2023, KOSMI supports beauty brands through focused color cosmetics manufacturing and flexible cooperation models.',servicesTitle:'Our Core Services',cards:[['OEM Manufacturing','Production based on your brand and agreed product specifications.'],['ODM Development','Formulation development, sampling and manufacturing cooperation.'],['Contract Processing & Filling','Production or filling with client-supplied materials or bulk, subject to assessment.'],['Packaging Services','Labeling, cartoning and packaging based on project requirements.']],processingTitle:'Two Contract Processing Models',modes:[['Client-Supplied Raw Materials','Clients provide raw materials and technical documentation; production follows an assessment.'],['Bulk Filling & Packaging','Clients provide finished bulk; filling, assembly and packaging follow an assessment.']],notice:'Material suitability, quality, regulatory requirements and responsibilities must be reviewed in advance.',productsTitle:'Color Cosmetics Categories',productsText:'Cushion foundation · Lipstick · Eyebrow pencil · Liquid eyeliner · Mascara · Color-changing lipstick · Two-tone lipstick',brandText:'KOSMI’s own color cosmetics brand, available for international wholesale cooperation.',contactTitle:'Start a Partnership',contactText:'We welcome OEM, ODM, contract processing, filling, packaging and KARA CAT wholesale inquiries. MOQ varies by product, formulation and packaging.',contactNote:'Official business email is being arranged; email inquiries are not yet enabled.'}};
function setLang(lang){let d=t[lang];document.documentElement.lang=lang;document.getElementById('nav').innerHTML=d.nav.map((n,i)=>'<a href="#'+['about','services','processing','brand','contact'][i]+'">'+n+'</a>').join('');for(let id of ['headline','intro','cta','aboutTitle','aboutText','servicesTitle','processingTitle','notice','productsTitle','productsText','brandText','contactTitle','contactText','contactNote'])document.getElementById(id)[id==='headline'?'innerHTML':'textContent']=d[id];for(let key of ['cards','modes'])document.getElementById(key).innerHTML=d[key].map((v,i)=>'<div class="tile"><div class="num">0'+(i+1)+'</div><h3>'+v[0]+'</h3><p>'+v[1]+'</p></div>').join('');for(let l of ['zh','ko','en'])document.getElementById(l).classList.toggle('active',l===lang)}setLang('zh');
